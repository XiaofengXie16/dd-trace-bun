name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the newest release of each supported dd-trace major
        dd-trace: ['5', '6']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5 # runs the node:http reference app of the parity suite
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun add --dev dd-trace@${{ matrix.dd-trace }}
      - run: bun run typecheck
      - run: bun test
